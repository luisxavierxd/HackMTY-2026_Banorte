[project]
name = "genui-harness"
version = "1.0.0"
description = "Harness LLM + MCP + A2UI para UI generativa en servicios financieros"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "google-genai>=1.0",
  "anthropic>=0.40",
  "mcp>=1.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
