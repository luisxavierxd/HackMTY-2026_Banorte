# Demo:        docker compose up --build          (harness + MCP educacion por HTTP)
# Escalado:    docker compose --profile scale up --scale harness=3
# Railway:     cada servicio se crea por separado (ver notes/DEPLOY_RAILWAY.md)
services:
  mcp-educacion:
    build: .
    command: python mcp_servers/educacion_financiera/server.py --http 8083
    environment:
      GENUI_DB: /data/state.json
    volumes: [genui-data:/data]
    expose: ["8083"]

  harness:
    build: .
    depends_on: [mcp-educacion]
    env_file: [.env]
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      MCP_SERVERS: >-
        {"servers":[
          {"name":"educacion_financiera","transport":"http","url":"http://mcp-educacion:8083/mcp"}]}
      SESSION_BACKEND: ${SESSION_BACKEND:-memory}
      REDIS_URL: redis://redis:6379/0
    ports: ["${PORT:-8080}:${PORT:-8080}"]

  redis:
    image: redis:7-alpine
    profiles: [scale]
    expose: ["6379"]

volumes:
  genui-data:
